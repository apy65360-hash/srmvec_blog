<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Faculty Login | SRMVEC CSE Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/src/styles/style.css" />
  <link rel="stylesheet" href="/src/styles/portal.css" />
  <style>
    .otp-code-input {
      letter-spacing: 0.35rem;
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      font-family: monospace;
    }
    .secondary-action {
      background: none;
      border: none;
      color: #6366f1;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .secondary-action:disabled {
      color: #94a3b8;
      text-decoration: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="role-choice-icon teacher" style="margin-bottom:1rem;"><i class="fa-solid fa-chalkboard-user"></i></div>
      <h1>Faculty Login</h1>
      <p class="login-sub" id="loginSubtitle">Sign in using your institutional email address and One-Time Password (OTP).</p>

      <div class="form-message" id="loginMessage"></div>

      <!-- STEP 1: Enter Faculty Email -->
      <form id="emailForm" novalidate>
        <div class="form-row">
          <label for="facultyEmail">Institutional Email ID</label>
          <input class="form-control" type="email" id="facultyEmail"
            placeholder="e.g. pr.cse@srmvalliammai.ac.in"
            autocomplete="email" required />
        </div>
        <div class="form-actions">
          <button class="btn btn-primary btn-block" type="submit" id="sendOtpBtn">
            <i class="fa-solid fa-paper-plane"></i> Send Verification Code
          </button>
        </div>
      </form>

      <!-- STEP 2: Enter 6-digit OTP (Hidden initially) -->
      <form id="otpForm" style="display:none;" novalidate>
        <div class="form-row">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="facultyOtp">Enter 6-Digit Code</label>
            <button type="button" class="secondary-action" id="changeEmailBtn">Change Email</button>
          </div>
          <input class="form-control otp-code-input" type="text" id="facultyOtp"
            placeholder="••••••" maxlength="6" inputmode="numeric" pattern="[0-9]*"
            autocomplete="one-time-code" required />
        </div>
        <div class="form-actions">
          <button class="btn btn-primary btn-block" type="submit" id="verifyOtpBtn">
            <i class="fa-solid fa-shield-check"></i> Verify &amp; Sign In
          </button>
        </div>
        <div style="text-align:center; margin-top: 1rem;">
          <span style="font-size:0.85rem; color:#64748b;">Didn't get the code? </span>
          <button type="button" class="secondary-action" id="resendOtpBtn">Resend Code</button>
          <span id="countdownText" style="font-size:0.82rem; color:#94a3b8; margin-left:0.3rem;"></span>
        </div>
      </form>

      <div class="role-hint">
        <p>Student? <a href="student-login.html">Student Login</a></p>
        <p style="margin-top:.4rem;"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/scripts/supabase.js"></script>
  <script type="module" src="/src/scripts/users.js"></script>
  <script type="module" src="/src/scripts/auth.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const box = document.getElementById("loginMessage");
      const emailForm = document.getElementById("emailForm");
      const otpForm = document.getElementById("otpForm");
      const facultyEmailInput = document.getElementById("facultyEmail");
      const facultyOtpInput = document.getElementById("facultyOtp");
      const sendOtpBtn = document.getElementById("sendOtpBtn");
      const verifyOtpBtn = document.getElementById("verifyOtpBtn");
      const resendOtpBtn = document.getElementById("resendOtpBtn");
      const changeEmailBtn = document.getElementById("changeEmailBtn");
      const countdownText = document.getElementById("countdownText");
      const subtitle = document.getElementById("loginSubtitle");

      let currentEmail = "";
      let countdownTimer = null;
      let secondsLeft = 0;

      if (params.get("denied")) {
        box.textContent = "That page is restricted to faculty accounts. Please sign in.";
        box.className = "form-message is-visible error";
      }

      function showMessage(msg, isError = true) {
        box.textContent = msg;
        box.className = "form-message is-visible " + (isError ? "error" : "success");
      }

      function startCountdown(sec = 45) {
        clearInterval(countdownTimer);
        secondsLeft = sec;
        resendOtpBtn.disabled = true;
        countdownText.textContent = `(${secondsLeft}s)`;

        countdownTimer = setInterval(() => {
          secondsLeft--;
          if (secondsLeft <= 0) {
            clearInterval(countdownTimer);
            resendOtpBtn.disabled = false;
            countdownText.textContent = "";
          } else {
            countdownText.textContent = `(${secondsLeft}s)`;
          }
        }, 1000);
      }

      // Step 1: Send OTP
      emailForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        box.className = "form-message";

        const email = facultyEmailInput.value.trim().toLowerCase();
        if (!email) {
          showMessage("Please enter your institutional email.");
          return;
        }

        sendOtpBtn.disabled = true;
        sendOtpBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking roster…';

        try {
          if (!window.Auth) {
            await new Promise(r => setTimeout(r, 100));
          }
          const res = await window.Auth.requestFacultyOtp(email);
          if (res.error) {
            showMessage(res.error, true);
            sendOtpBtn.disabled = false;
            sendOtpBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Verification Code';
            return;
          }

          currentEmail = email;
          emailForm.style.display = "none";
          otpForm.style.display = "block";
          subtitle.textContent = `Enter the 6-digit code sent to ${currentEmail}`;
          showMessage(res.message || "Verification code sent to your email.", false);
          facultyOtpInput.focus();
          startCountdown(45);
        } catch (err) {
          showMessage(err.message || "An unexpected error occurred.");
          sendOtpBtn.disabled = false;
          sendOtpBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Verification Code';
        }
      });

      // Step 2: Verify OTP
      otpForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        box.className = "form-message";

        const otp = facultyOtpInput.value.trim();
        if (!otp || otp.length < 6) {
          showMessage("Please enter the complete 6-digit verification code.");
          return;
        }

        verifyOtpBtn.disabled = true;
        verifyOtpBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying…';

        try {
          const res = await window.Auth.verifyFacultyOtp(currentEmail, otp);
          if (res.error) {
            showMessage(res.error, true);
            verifyOtpBtn.disabled = false;
            verifyOtpBtn.innerHTML = '<i class="fa-solid fa-shield-check"></i> Verify &amp; Sign In';
            return;
          }

          showMessage("Verification successful! Redirecting…", false);
          setTimeout(() => {
            location.href = window.Auth.safeNext(params.get("next")) || "teachers-corner.html";
          }, 600);
        } catch (err) {
          showMessage(err.message || "Verification failed. Please try again.");
          verifyOtpBtn.disabled = false;
          verifyOtpBtn.innerHTML = '<i class="fa-solid fa-shield-check"></i> Verify &amp; Sign In';
        }
      });

      // Resend OTP
      resendOtpBtn.addEventListener("click", async function () {
        if (!currentEmail || secondsLeft > 0) return;
        resendOtpBtn.disabled = true;
        const res = await window.Auth.requestFacultyOtp(currentEmail);
        if (res.error) {
          showMessage(res.error, true);
          resendOtpBtn.disabled = false;
        } else {
          showMessage("New verification code dispatched.", false);
          startCountdown(45);
        }
      });

      // Change Email
      changeEmailBtn.addEventListener("click", function () {
        clearInterval(countdownTimer);
        otpForm.style.display = "none";
        emailForm.style.display = "block";
        subtitle.textContent = "Sign in using your institutional email address and One-Time Password (OTP).";
        sendOtpBtn.disabled = false;
        sendOtpBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Verification Code';
        box.className = "form-message";
        facultyEmailInput.focus();
      });

    }());
  </script>

</body>
</html>
