<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Faculty Login | SRMVEC CSE Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/src/styles/style.css" />
  <link rel="stylesheet" href="/src/styles/portal.css" />
  <style>
    /* ── Page shell: navy gradient matching the site ── */
    body {
      background: linear-gradient(160deg, var(--primary-navy, #002947) 0%, #001F35 55%, #00375c 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ── Subtle top bar to echo the site header ── */
    .faculty-topbar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .faculty-topbar a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.75);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.15s;
    }
    .faculty-topbar a:hover { color: var(--accent-gold, #F59E0B); }
    .faculty-topbar .topbar-brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
    }
    .faculty-topbar .topbar-sep {
      color: rgba(255,255,255,0.25);
      margin: 0 0.15rem;
    }

    /* ── Wrapper ── */
    .simple-auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 3rem;
    }

    /* ── Card ── */
    .simple-auth-card {
      background: #ffffff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35), 0 8px 16px rgba(0,0,0,0.18);
      width: 100%;
      max-width: 430px;
      overflow: hidden;
    }

    /* ── Navy header strip inside the card ── */
    .simple-card-header {
      background: linear-gradient(135deg, var(--primary-navy, #002947) 0%, #003d6b 100%);
      padding: 1.75rem 2rem 1.5rem;
      text-align: center;
      position: relative;
    }
    .simple-card-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-gold, #F59E0B), #FBBF24, var(--accent-gold, #F59E0B));
    }
    .simple-card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(245, 158, 11, 0.18);
      border: 1.5px solid rgba(245, 158, 11, 0.35);
      color: var(--accent-gold, #F59E0B);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 0.85rem;
    }
    .simple-card-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.3rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .simple-card-header p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.65);
      margin: 0;
    }

    /* ── Form body ── */
    .simple-card-body {
      padding: 1.75rem 2rem 2rem;
    }

    .view-panel { display: none; }
    .view-panel.active { display: block; animation: simpleFade 0.2s ease-out; }
    @keyframes simpleFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Alert messages ── */
    .form-message {
      display: none;
      padding: 0.7rem 0.95rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }
    .form-message.is-visible { display: flex; align-items: flex-start; gap: 0.5rem; }
    .form-message.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .form-message.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .form-message.info    { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .form-message.warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }

    /* ── Password eye toggle ── */
    .pw-wrap { position: relative; }
    .pw-eye {
      position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: #94a3b8; font-size: 0.88rem;
    }
    .pw-eye:hover { color: var(--primary-navy, #002947); }

    /* ── Switch links ── */
    .switch-link {
      color: var(--accent-blue, #2563eb);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }
    .switch-link:hover { color: #1d4ed8; }

    /* ── Form rows ── */
    .form-row { margin-bottom: 1.1rem; }
    .form-row label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--primary-navy, #002947);
      margin-bottom: 0.38rem;
    }
    .form-control {
      width: 100%;
      padding: 0.68rem 0.9rem;
      border: 1.5px solid var(--border-color, #e2e8f0);
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text-dark, #0f172a);
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #ffffff;
      box-sizing: border-box;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary-navy, #002947);
      box-shadow: 0 0 0 3px rgba(0, 41, 71, 0.1);
    }

    /* ── Buttons ── */
    .btn-block {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.78rem 1rem;
      font-size: 0.93rem;
      font-weight: 700;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.01em;
      transition: filter 0.15s, transform 0.1s;
    }
    .btn-block:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .btn-block:active { transform: scale(0.99); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-navy, #002947) 0%, #003d6b 100%);
      color: #ffffff;
    }
    .btn-muted {
      background: var(--surface, #f8fafc);
      color: var(--text-muted, #475569);
      border: 1px solid var(--border-color, #e2e8f0);
    }
    .btn-muted:hover { background: #f1f5f9; }

    /* ── Footer links ── */
    .card-footer-links {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: var(--text-muted, #64748b);
      line-height: 1.7;
    }

    /* ── OTP info box ── */
    .otp-info-box {
      background: #f0f6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 0.84rem;
      color: #1d4ed8;
      margin-bottom: 1.15rem;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ── Back link at bottom of card ── */
    .faculty-back-link {
      display: block;
      text-align: center;
      padding: 0.9rem;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.5);
      border-top: 1px solid rgba(255,255,255,0.07);
      text-decoration: none;
      transition: color 0.15s;
    }
    .faculty-back-link:hover { color: var(--accent-gold, #F59E0B); }
  </style>
</head>
<body>

<!-- Topbar echoing the site nav -->
<nav class="faculty-topbar">
  <a href="index.html"><i class="fa-solid fa-house"></i></a>
  <span class="topbar-sep">/</span>
  <span class="topbar-brand">SRMVEC CSE</span>
  <span class="topbar-sep">·</span>
  <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Portal Login</a>
</nav>

<div class="simple-auth-wrapper">
  <div class="simple-auth-card">

    <!-- Card Header -->
    <div class="simple-card-header">
      <div class="simple-card-icon">
        <i class="fa-solid fa-chalkboard-user"></i>
      </div>
      <h2 id="cardHeaderTitle">Faculty Login</h2>
      <p id="cardHeaderSub">Sign in to access Teacher's Corner</p>
    </div>

    <!-- Alert / Message Banner -->
    <div class="simple-card-body">
    <div class="form-message" id="authMsg">
      <i class="fa-solid fa-circle-info" id="authMsgIcon" style="margin-top:0.15rem; flex-shrink:0;"></i>
      <span id="authMsgText"></span>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         1. SIGN IN (DEFAULT)
         ══════════════════════════════════════════════════════════════ -->
    <div class="view-panel active" id="panelLogin">
      <form id="loginForm" novalidate>
        <div class="form-row">
          <label for="loginEmail">Enter your mail id</label>
          <input class="form-control" type="email" id="loginEmail"
            placeholder="e.g. name.cse@srmvalliammai.ac.in"
            autocomplete="email" required />
        </div>

        <div class="form-row">
          <label for="loginPw">Password</label>
          <div class="pw-wrap">
            <input class="form-control" type="password" id="loginPw"
              placeholder="Enter your password"
              autocomplete="current-password" required />
            <span class="pw-eye" onclick="togglePw('loginPw', this)"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>

        <div style="margin-top: 1.5rem;">
          <button class="btn-block btn-primary" type="submit" id="btnLogin">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>
        </div>

        <div class="card-footer-links">
          <span class="switch-link" id="linkToForgot">Forgot password?</span>
          <br />
          Don't have an account? <span class="switch-link" id="linkToSignUp">Sign Up</span>
        </div>
      </form>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         2. SIGN UP (ENTER NAME, POSITION OPTIONS, MAIL ID)
         ══════════════════════════════════════════════════════════════ -->
    <div class="view-panel" id="panelSignUp">
      
      <!-- Sub-step 1: Details Entry -->
      <div id="signUpStep1">
        <form id="signUpForm1" novalidate>
          <div class="form-row">
            <label for="regName">Enter your name</label>
            <input class="form-control" type="text" id="regName"
              placeholder="e.g. Dr. B. Vanathi"
              autocomplete="name" required />
          </div>

          <div class="form-row">
            <label for="regPosition">Position</label>
            <select class="form-control" id="regPosition" required>
              <option value="">-- Choose Position --</option>
              <option value="Professor &amp; Head">Professor &amp; Head</option>
              <option value="Professor">Professor</option>
              <option value="Associate Professor">Associate Professor</option>
              <option value="Assistant Professor (Selection Grade)">Assistant Professor (Selection Grade)</option>
              <option value="Assistant Professor (Senior Grade)">Assistant Professor (Senior Grade)</option>
              <option value="Assistant Professor (Ordinary Grade)">Assistant Professor (Ordinary Grade)</option>
              <option value="Teaching Research Associate (TRA)">Teaching Research Associate (TRA)</option>
            </select>
          </div>

          <div class="form-row">
            <label for="regEmail">Mail ID</label>
            <input class="form-control" type="email" id="regEmail"
              placeholder="e.g. name.cse@srmvalliammai.ac.in"
              autocomplete="email" required />
          </div>

          <div style="margin-top: 1.5rem;">
            <button class="btn-block btn-primary" type="submit" id="btnSendSignUpOtp">
              <i class="fa-solid fa-paper-plane"></i> Send OTP
            </button>
          </div>

          <div class="card-footer-links">
            Already have an account? <span class="switch-link" id="linkToLoginFromSignUp">Sign In</span>
          </div>
        </form>
      </div>

      <!-- Sub-step 2: OTP Verification & Set Password -->
      <div id="signUpStep2" style="display:none;">
        <form id="signUpForm2" novalidate>
          <div class="otp-info-box">
            <i class="fa-solid fa-envelope"></i>
            Enter the 6-digit code sent to <strong id="signUpTargetEmail"></strong>.
          </div>

          <div class="form-row">
            <label for="signUpOtp">Enter 6-Digit OTP</label>
            <input class="form-control" type="text" id="signUpOtp"
              maxlength="6" placeholder="• • • • • •"
              style="letter-spacing: 0.35em; font-size: 1.3rem; font-weight: 700; text-align: center; font-family: monospace;"
              required />
          </div>

          <div class="form-row">
            <label for="signUpNewPw">Set Password</label>
            <div class="pw-wrap">
              <input class="form-control" type="password" id="signUpNewPw"
                placeholder="Minimum 8 characters"
                autocomplete="new-password" required />
              <span class="pw-eye" onclick="togglePw('signUpNewPw', this)"><i class="fa-solid fa-eye"></i></span>
            </div>
          </div>

          <div class="form-row">
            <label for="signUpConfirmPw">Confirm Password</label>
            <div class="pw-wrap">
              <input class="form-control" type="password" id="signUpConfirmPw"
                placeholder="Re-enter password"
                autocomplete="new-password" required />
              <span class="pw-eye" onclick="togglePw('signUpConfirmPw', this)"><i class="fa-solid fa-eye"></i></span>
            </div>
          </div>

          <div style="margin-top: 1.4rem;">
            <button class="btn-block btn-primary" type="submit" id="btnCompleteSignUp">
              <i class="fa-solid fa-check-circle"></i> Complete Sign Up
            </button>
          </div>

          <div style="text-align:center; margin-top:0.85rem;">
            <button type="button" class="btn-block btn-muted" id="btnBackToSignUp1" style="font-size:0.86rem; padding:0.5rem 0.75rem;">
              <i class="fa-solid fa-arrow-left"></i> Back
            </button>
          </div>
        </form>
      </div>

    </div>

    <!-- ══════════════════════════════════════════════════════════════
         3. FORGOT PASSWORD (MAIL ID + OTP)
         ══════════════════════════════════════════════════════════════ -->
    <div class="view-panel" id="panelForgot">
      
      <!-- Sub-step 1: Enter Mail ID -->
      <div id="forgotStep1">
        <form id="forgotForm1" novalidate>
          <div class="form-row">
            <label for="forgotEmail">Enter your mail id</label>
            <input class="form-control" type="email" id="forgotEmail"
              placeholder="e.g. name.cse@srmvalliammai.ac.in"
              autocomplete="email" required />
          </div>

          <div style="margin-top: 1.5rem;">
            <button class="btn-block btn-primary" type="submit" id="btnSendForgotOtp">
              <i class="fa-solid fa-paper-plane"></i> Send OTP
            </button>
          </div>

          <div class="card-footer-links">
            Remember your password? <span class="switch-link" id="linkToLoginFromForgot">Back to Sign In</span>
          </div>
        </form>
      </div>

      <!-- Sub-step 2: Enter OTP & Reset Password -->
      <div id="forgotStep2" style="display:none;">
        <form id="forgotForm2" novalidate>
          <div class="otp-info-box">
            <i class="fa-solid fa-envelope"></i>
            Reset code sent to <strong id="forgotEmailDisplay"></strong>.
          </div>

          <div class="form-row">
            <label for="forgotOtp">Enter 6-Digit OTP</label>
            <input class="form-control" type="text" id="forgotOtp"
              maxlength="6" placeholder="• • • • • •"
              style="letter-spacing: 0.35em; font-size: 1.3rem; font-weight: 700; text-align: center; font-family: monospace;"
              required />
          </div>

          <div class="form-row">
            <label for="forgotNewPw">Set New Password</label>
            <div class="pw-wrap">
              <input class="form-control" type="password" id="forgotNewPw"
                placeholder="Minimum 8 characters"
                autocomplete="new-password" required />
              <span class="pw-eye" onclick="togglePw('forgotNewPw', this)"><i class="fa-solid fa-eye"></i></span>
            </div>
          </div>

          <div class="form-row">
            <label for="forgotConfirmPw">Confirm Password</label>
            <div class="pw-wrap">
              <input class="form-control" type="password" id="forgotConfirmPw"
                placeholder="Re-enter password"
                autocomplete="new-password" required />
              <span class="pw-eye" onclick="togglePw('forgotConfirmPw', this)"><i class="fa-solid fa-eye"></i></span>
            </div>
          </div>

          <div style="margin-top: 1.4rem;">
            <button class="btn-block btn-primary" type="submit" id="btnCompleteForgot">
              <i class="fa-solid fa-check"></i> Reset Password
            </button>
          </div>

          <div style="text-align:center; margin-top:0.85rem;">
            <button type="button" class="btn-block btn-muted" id="btnBackToForgot1" style="font-size:0.86rem; padding:0.5rem 0.75rem;">
              <i class="fa-solid fa-arrow-left"></i> Back
            </button>
          </div>
        </form>
      </div>

    </div>

  </div><!-- /.simple-card-body -->

  </div><!-- /.simple-auth-card -->
</div><!-- /.simple-auth-wrapper -->

<a class="faculty-back-link" href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Portal Login</a>

<script type="module" src="/src/scripts/supabase.js"></script>
<script type="module" src="/src/scripts/users.js"></script>
<script type="module" src="/src/scripts/auth.js"></script>
<script type="module">
import { Auth } from '/src/scripts/auth.js';
import { PortalUsers } from '/src/scripts/users.js';

const params = new URLSearchParams(location.search);
const nextPage = Auth.safeNext?.(params.get('next')) || 'teachers-corner.html';

// ── Password Visibility Toggle ──
window.togglePw = function(id, eye) {
  const inp = document.getElementById(id);
  const showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  eye.innerHTML = showing ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
};

// ── DOM References ──
const authMsg = document.getElementById('authMsg');
const authMsgText = document.getElementById('authMsgText');
const authMsgIcon = document.getElementById('authMsgIcon');

const cardHeaderTitle = document.getElementById('cardHeaderTitle');
const cardHeaderSub   = document.getElementById('cardHeaderSub');

const panelLogin  = document.getElementById('panelLogin');
const panelSignUp = document.getElementById('panelSignUp');
const panelForgot = document.getElementById('panelForgot');

const signUpStep1 = document.getElementById('signUpStep1');
const signUpStep2 = document.getElementById('signUpStep2');

const forgotStep1 = document.getElementById('forgotStep1');
const forgotStep2 = document.getElementById('forgotStep2');

function showMsg(text, type = 'error') {
  authMsgText.textContent = text;
  authMsg.className = `form-message is-visible ${type}`;
  if (type === 'error') {
    authMsgIcon.className = 'fa-solid fa-circle-exclamation';
  } else if (type === 'success') {
    authMsgIcon.className = 'fa-solid fa-circle-check';
  } else {
    authMsgIcon.className = 'fa-solid fa-circle-info';
  }
}

function clearMsg() {
  authMsgText.textContent = '';
  authMsg.className = 'form-message';
}

function setLoading(btn, text) {
  btn.disabled = true;
  btn._orig = btn.innerHTML;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${text}`;
}

function resetBtn(btn) {
  btn.disabled = false;
  btn.innerHTML = btn._orig || btn.innerHTML;
}

// ── Switch View Mode ──
function setView(view) {
  clearMsg();
  [panelLogin, panelSignUp, panelForgot].forEach(p => p.classList.remove('active'));

  if (view === 'signup') {
    cardHeaderTitle.textContent = 'Faculty Sign Up';
    cardHeaderSub.textContent = 'Create your faculty account';
    panelSignUp.classList.add('active');
    signUpStep1.style.display = 'block';
    signUpStep2.style.display = 'none';
  } else if (view === 'forgot') {
    cardHeaderTitle.textContent = 'Reset Password';
    cardHeaderSub.textContent = 'Enter your mail id to receive an OTP';
    panelForgot.classList.add('active');
    forgotStep1.style.display = 'block';
    forgotStep2.style.display = 'none';
  } else {
    cardHeaderTitle.textContent = 'Faculty Login';
    cardHeaderSub.textContent = 'Sign in to access Teacher\'s Corner';
    panelLogin.classList.add('active');
  }
}

document.getElementById('linkToSignUp').addEventListener('click', () => setView('signup'));
document.getElementById('linkToForgot').addEventListener('click', () => setView('forgot'));
document.getElementById('linkToLoginFromSignUp').addEventListener('click', () => setView('login'));
document.getElementById('linkToLoginFromForgot').addEventListener('click', () => setView('login'));

if (params.get('tab') === 'setup' || params.get('tab') === 'signup') {
  setView('signup');
} else if (params.get('tab') === 'forgot') {
  setView('forgot');
}


// ══════════════════════════════════════════════════════════════
// 1. SIGN IN (MAIL ID + PASSWORD)
// ══════════════════════════════════════════════════════════════
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearMsg();

  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPw').value;

  if (!email) {
    showMsg('Please enter your mail id.', 'error');
    return;
  }
  if (!PortalUsers.isValidTeacherEmail(email)) {
    showMsg('Invalid mail id.', 'error');
    return;
  }
  if (!password) {
    showMsg('Please enter your password.', 'error');
    return;
  }

  const btn = document.getElementById('btnLogin');
  setLoading(btn, 'Signing in…');

  try {
    const res = await Auth.loginTeacher(email, password);
    resetBtn(btn);

    if (res?.error) {
      showMsg(res.error || 'Invalid mail id or incorrect password.', 'error');
      return;
    }

    showMsg('Login successful! Redirecting…', 'success');
    setTimeout(() => {
      location.href = nextPage;
    }, 400);

  } catch (err) {
    resetBtn(btn);
    showMsg(err.message || 'Login failed.', 'error');
  }
});


// ══════════════════════════════════════════════════════════════
// 2. SIGN UP (ENTER NAME, CHOOSE POSITION, ENTER MAIL ID + OTP)
// ══════════════════════════════════════════════════════════════
let activeSignUpEmail = '';
let activeSignUpName = '';

// Step 1: Submit Details & Request OTP
document.getElementById('signUpForm1').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearMsg();

  const name     = document.getElementById('regName').value.trim();
  const position = document.getElementById('regPosition').value.trim();
  const email    = document.getElementById('regEmail').value.trim().toLowerCase();

  if (!name || !position) {
    showMsg('Invalid details.', 'error');
    return;
  }
  if (!email || !PortalUsers.isValidTeacherEmail(email)) {
    showMsg('Invalid mail id.', 'error');
    return;
  }

  const btn = document.getElementById('btnSendSignUpOtp');
  setLoading(btn, 'Sending OTP…');

  try {
    const res = await Auth.requestFacultySignupOtp(name, position, email);
    resetBtn(btn);

    if (res?.error) {
      showMsg(res.error, 'error');
      return;
    }

    activeSignUpEmail = email;
    activeSignUpName = res.name || name;
    document.getElementById('signUpTargetEmail').textContent = email;

    // Transition to Step 2
    signUpStep1.style.display = 'none';
    signUpStep2.style.display = 'block';

    showMsg(`Verification code dispatched to ${email}.`, 'info');
    document.getElementById('signUpOtp').focus();

  } catch (err) {
    resetBtn(btn);
    showMsg(err.message || 'Failed to dispatch verification code.', 'error');
  }
});

document.getElementById('btnBackToSignUp1').addEventListener('click', () => {
  signUpStep1.style.display = 'block';
  signUpStep2.style.display = 'none';
  clearMsg();
});

// Step 2: Verify OTP & Set Password
document.getElementById('signUpForm2').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearMsg();

  const otp = document.getElementById('signUpOtp').value.trim();
  const newPw = document.getElementById('signUpNewPw').value;
  const confirmPw = document.getElementById('signUpConfirmPw').value;

  if (!otp || otp.length < 6) {
    showMsg('Invalid verification code.', 'error');
    return;
  }
  if (!newPw || newPw.length < 8) {
    showMsg('Password must be at least 8 characters.', 'error');
    return;
  }
  if (newPw !== confirmPw) {
    showMsg('Passwords do not match.', 'error');
    return;
  }

  const btn = document.getElementById('btnCompleteSignUp');
  setLoading(btn, 'Setting password…');

  try {
    // 1. Verify OTP
    const vRes = await Auth.verifyFacultyOtp(activeSignUpEmail, otp);
    if (vRes?.error) {
      resetBtn(btn);
      showMsg(vRes.error, 'error');
      return;
    }

    // 2. Set password & create account
    const pwRes = await Auth.completeFacultyPasswordSetup(activeSignUpEmail, newPw);
    resetBtn(btn);

    if (pwRes?.error) {
      showMsg(pwRes.error, 'error');
      return;
    }

    showMsg('Account successfully created! Signing you in…', 'success');
    setTimeout(() => {
      location.href = nextPage;
    }, 500);

  } catch (err) {
    resetBtn(btn);
    showMsg(err.message || 'Sign up failed.', 'error');
  }
});

// 3. FORGOT PASSWORD (MAIL ID + OTP + NEW PASSWORD)

document.getElementById('forgotForm2').addEventListener('submit', async function(e) {

  if (!otp || otp.length < 6) {

    if (vRes?.error) {
      resetBtn(btn);
      showMsg(vRes.error, 'error');

    const resetRes = await Auth.completeFacultyPasswordSetup(activeForgotEmail, newPw);

    }

    showMsg('Password updated successfully! Signing you in…', 'success');
    setTimeout(() => {
      location.href = nextPage;
    }, 500);

  } catch (err) {

    showMsg(err.message || 'Failed to reset password.', 'error');
  }
});

// Auto redirect if already logged in
window.addEventListener('DOMContentLoaded', async () => {
  await new Promise(r => setTimeout(r, 120));
  const user = window.Auth?.currentUser?.();
  if (user && (user.role === 'teacher' || user.role === 'faculty_admin' || user.role === 'admin')) {
    location.replace(nextPage);
  }
});
