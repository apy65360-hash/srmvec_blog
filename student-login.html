<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login | SRMVEC CSE Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/src/styles/style.css" />
  <link rel="stylesheet" href="/src/styles/portal.css" />
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="role-choice-icon student" style="margin-bottom:1rem;"><i class="fa-solid fa-user-graduate"></i></div>
      <h1>Student Login</h1>
      <p class="login-sub">Sign in with your register number and date of birth.</p>

      <div class="form-message" id="loginMessage"></div>

      <form id="loginForm" novalidate>
        <div class="form-row">
          <label for="loginRegNo">Register Number</label>
          <input class="form-control" type="text" id="loginRegNo"
            placeholder="e.g. CSE2201"
            autocomplete="username" required />
        </div>
        <div class="form-row">
          <label for="loginDOB">Date of Birth (password)</label>
          <input class="form-control" type="date" id="loginDOB"
            autocomplete="bday" required />
          <small class="form-hint">Your date of birth is used as your password.</small>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary btn-block" type="submit">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>
        </div>
      </form>

      <div class="role-hint">
        <p>No account yet? <a href="student-signup.html">Create a student account</a></p>
        <p>Faculty member? <a href="teacher-login.html">Teacher login</a></p>
        <p>Demo: Register No. <code>CSE2201</code> / DOB <code>15/08/2003</code></p>
        <p style="margin-top:.6rem;"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/scripts/users.js"></script>
  <script type="module" src="/src/scripts/auth.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const box = document.getElementById("loginMessage");

      if (params.get("registered")) {
        box.textContent = "Account created. Sign in with your register number and date of birth.";
        box.className = "form-message is-visible success";
      }

      document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();
        box.textContent = "";
        box.className = "form-message";

        const regNo = document.getElementById("loginRegNo").value.trim();
        const dob   = document.getElementById("loginDOB").value.trim(); // ISO YYYY-MM-DD from <input type="date">

        if (!regNo || !dob) {
          box.textContent = "Please enter your register number and date of birth.";
          box.className = "form-message is-visible error";
          return;
        }

        function tryLogin() {
          if (!window.Auth || !window.PortalUsers) {
            setTimeout(tryLogin, 60);
            return;
          }
          const user = window.PortalUsers.matchStudent(regNo, dob);
          if (user) {
            const session = window.Auth.startSession(user);
            location.href = Auth.safeNext(params.get("next")) || Auth.homeFor(session.role);
          } else {
            box.textContent = "No student account found for that register number and date of birth.";
            box.className = "form-message is-visible error";
          }
        }
        tryLogin();
      });
    }());
  </script>

</body>
</html>
