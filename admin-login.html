<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | SRMVEC CSE Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/src/styles/style.css" />
  <link rel="stylesheet" href="/src/styles/portal.css" />
  <style>
    .admin-login-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.25rem;
      background: linear-gradient(135deg, #0F172A, #1E1B4B);
    }
    .admin-login-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .admin-login-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      color: var(--white);
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.3);
    }
    .admin-login-title {
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      font-size: 1.75rem;
      color: #0F172A;
      margin-bottom: 0.25rem;
      font-weight: 700;
    }
    .admin-login-sub {
      text-align: center;
      color: #64748B;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .password-container {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #64748B;
      font-size: 1rem;
      transition: color 0.2s;
    }
    .password-toggle:hover {
      color: #3730A3;
    }
    .btn-admin {
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: var(--white);
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }
    .btn-admin:disabled {
      background: #94A3B8;
      cursor: not-allowed;
      transform: none !important;
      filter: none !important;
    }
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #10B981;
      font-weight: 600;
      background: #ECFDF5;
      padding: 0.5rem;
      border-radius: 8px;
    }
    .security-badge i {
      font-size: 0.9rem;
    }
    .cooldown-text {
      color: #EF4444;
      font-weight: 600;
      text-align: center;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div class="admin-login-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="admin-login-title">Secure Portal</h1>
      <p class="admin-login-sub">Administrative Sign-In Access</p>

      <div class="form-message" id="loginMessage"></div>

      <form id="adminLoginForm" novalidate>
        <div class="form-row">
          <label for="loginUsername">Admin Username</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="Enter administrative username" autocomplete="username" required />
        </div>

        <div class="form-row">
          <label for="loginPassword">Secret Key / Password</label>
          <div class="password-container">
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter admin password" autocomplete="current-password" required />
            <i class="fa-solid fa-eye password-toggle" id="togglePasswordBtn"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-admin btn-block" id="submitBtn">
          <i class="fa-solid fa-lock"></i> Authorize & Sign In
        </button>
      </form>

      <div class="security-badge">
        <i class="fa-solid fa-circle-check"></i>
        <span>256-bit Simulated Session Encryption Active</span>
      </div>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:#94A3B8;">
        <a href="index.html" style="color:#4F46E5;text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Return to Main Directory</a>
      </p>
    </div>
  </div>

  <script type="module" src="/src/scripts/supabase.js"></script>
  <script type="module" src="/src/scripts/blog-data.js"></script>
  <script type="module" src="/src/scripts/auth.js"></script>
  <script type="module">
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("adminLoginForm");
      const messageBox = document.getElementById("loginMessage");
      const passwordInput = document.getElementById("loginPassword");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const submitBtn = document.getElementById("submitBtn");

      let failedAttempts = 0;
      let lockUntil = 0;

      // Handle redirect if already logged in as admin
      const checkSession = () => {
        const saved = window.Auth ? window.Auth.currentUser() : (window.BlogDB ? window.BlogDB.getCurrentUser() : null);
        const isAdmin = saved && ["admin", "faculty_admin", "editor"].includes(saved.role);
        if (isAdmin) {
          const params = new URLSearchParams(location.search);
          const next = params.get("next") || "admin-corner.html";
          location.replace(next);
        }
      };
      
      // Delay check slightly to make sure modules load
      setTimeout(checkSession, 100);

      // Password toggle
      togglePasswordBtn.addEventListener("click", () => {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          togglePasswordBtn.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          passwordInput.type = "password";
          togglePasswordBtn.classList.replace("fa-eye-slash", "fa-eye");
        }
      });

      // Handle Form Submit
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Check if locked out
        const now = Date.now();
        if (now < lockUntil) {
          const remaining = Math.ceil((lockUntil - now) / 1000);
          showError(`Too many failed attempts. Locked out for ${remaining}s.`);
          return;
        }

        const username = document.getElementById("loginUsername").value.trim();
        const password = passwordInput.value;

        // Form Validation
        if (!username || !password) {
          showError("Username and password are required.");
          return;
        }

        // Sanitize check
        if (/[<>]/.test(username) || /[<>]/.test(password)) {
          showError("Invalid characters detected.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

        // Authenticate via Auth / Supabase
        let res = null;
        if (window.Auth && window.Auth.login) {
          res = await window.Auth.login(username, password, "admin");
        }

        let user = null;
        let errorMessage = null;

        if (res && res.error) {
          errorMessage = res.error;
        } else if (res && res.role) {
          user = res;
        } else if (window.BlogDB) {
          user = window.BlogDB.authenticate(username, password, "admin");
          if (user && window.Auth) {
            window.Auth.startSession(user);
          }
        }

        const isAdmin = user && ["admin", "faculty_admin", "editor"].includes(user.role);
        if (isAdmin) {
          failedAttempts = 0;
          messageBox.className = "form-message is-visible success";
          messageBox.textContent = "Access Authorized. Redirecting to Admin Corner...";
          submitBtn.disabled = true;

          setTimeout(() => {
            const params = new URLSearchParams(location.search);
            const next = params.get("next") || "admin-corner.html";
            location.replace(next);
          }, 800);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Authorize & Sign In';
          failedAttempts++;
          
          const errDetail = errorMessage ? `Supabase: ${errorMessage}` : "Invalid admin credentials";

          if (failedAttempts >= 3) {
            lockUntil = Date.now() + 30000; // 30 second lock
            submitBtn.disabled = true;
            showError(`Access Denied (${errDetail}). Locked out for 30 seconds.`);
            startCooldown(30);
          } else {
            showError(`Access Denied (${errDetail}). (${3 - failedAttempts} attempts remaining)`);
          }
        }
      });

      function showError(msg) {
        messageBox.className = "form-message is-visible error";
        messageBox.textContent = msg;
      }

      function startCooldown(seconds) {
        let remaining = seconds;
        const interval = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(interval);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Authorize & Sign In';
            messageBox.className = "form-message";
          } else {
            submitBtn.innerHTML = `<i class="fa-solid fa-clock"></i> Locked (${remaining}s)`;
          }
        }, 1000);
      }

      // Check denied message
      const params = new URLSearchParams(location.search);
      if (params.get("denied")) {
        showError("Access Denied. Administrative privileges required to view that page.");
      }
    });
  </script>

</body>
</html>
